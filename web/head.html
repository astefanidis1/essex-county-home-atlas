}

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1311;
  --surface: #171c19;
  --surface-2: #1c221e;
  --ink: #eef2ee;
  --ink-2: #b7c1ba;

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nowrap { white-space: nowrap; }

.page {
  max-width: 1240px;
  margin-inline: auto;
  padding-inline: 20px;
  padding-block: 32px 64px;
  display: grid;
  gap: 32px;
}
@media (max-width: 560px) { .page { padding-inline: 16px; padding-block: 22px 48px; gap: 26px; } }
.page.booting > :not(.masthead):not(.boot) { display: none; }
.boot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: var(--ink-2); }
.boot[hidden] { display: none; }
.boot .bar { flex: 1 1 200px; max-width: 320px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.boot .bar i { display: block; height: 100%; width: 35%; border-radius: 99px; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) { .boot .bar i { animation: none; width: 60%; } }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h2 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; }

/* masthead + scope */
.masthead { display: grid; gap: 8px; }
.masthead h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 5.4vw, 56px); line-height: 1; letter-spacing: -.01em; }
.lede { color: var(--ink-2); font-size: 16px; max-width: 66ch; }
.scope { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; justify-self: start; max-width: 100%; }
.scope button { border: 0; background: none; padding: 8px 13px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.scope button:hover { background: var(--surface-2); color: var(--ink); }
.scope button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
@media (max-width: 420px) { .scope { gap: 2px; } .scope button { padding: 7px 9px; font-size: 13.5px; } }
.top { display: grid; gap: 14px; }

/* leaders */
.leaders { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .leaders { grid-template-columns: minmax(0, 1fr); } }
.winner { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
@media (max-width: 560px) { .winner { padding: 18px; } }
.winner h2 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 3.8vw, 40px); line-height: 1.02; }
.winner h2 small { font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.hero-num { font-size: clamp(34px, 4.6vw, 48px); font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.hero-num span { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; padding-block: 12px; border-block: 1px solid var(--line); }
@media (max-width: 520px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.facts div { display: grid; gap: 2px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.caveats { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.caveats li { font-size: 14px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; background: var(--caveat-bg); }
.caveats li b { color: var(--caveat-ink); font-weight: 700; margin-right: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 10px 15px; border-radius: 10px; border: 0; font-size: 14.5px; }
.btn:hover { filter: brightness(1.08); }
.btn-2 { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; padding: 9px 13px; border-radius: 10px; border: 1px solid var(--line-2); font-size: 14px; }
.btn-2:hover { border-color: var(--ink-2); }
.btn-sm { padding: 7px 11px; font-size: 13.5px; border-radius: 9px; }

.runners { display: grid; gap: 8px; padding-top: 4px; }
.runners-head { display: flex; justify-content: space-between; gap: 12px; }
.runners ol { list-style: none; margin: 0; padding: 0; }
.runners li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding-block: 11px; border-top: 1px solid var(--line); }
.runners li:last-child { border-bottom: 1px solid var(--line); }
.rk { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkish { padding: 0; border: 0; background: none; text-align: left; font-weight: 600; color: var(--ink); }
.linkish:hover { color: var(--accent); text-decoration: underline; }
.sub { display: block; font-size: 13px; color: var(--muted); }
.runners .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.runners .v span { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.note { font-size: 14px; color: var(--ink-2); }

.badges { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.badge { font-size: 11.5px; font-weight: 600; letter-spacing: .01em; padding: 2px 7px; border-radius: 999px; background: var(--caveat-bg); color: var(--caveat-ink); white-space: nowrap; }
.badge.est { background: var(--accent-soft); color: var(--accent); }
.badge.lm { background: var(--ink); color: var(--surface); }
.badge.why { background: var(--why-bg); color: var(--why-ink); }
.badge.why.muted { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
.why-box { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.why-box p { margin: 0; }
.why-box .why-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
.why-box .why-head b { color: var(--ink); margin-right: 2px; }
.landmark { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface-2); }
.landmark p { font-size: 14px; color: var(--ink-2); }
.landmark .eyebrow { font-size: 11.5px; }
.lm-src { font-size: 12.5px !important; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px 22px; padding-block: 14px; border-block: 1px solid var(--line); }
@media (max-width: 800px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats div { display: grid; gap: 2px; }
.stats strong { font-size: 21px; font-weight: 700; line-height: 1.2; }
.stats span { font-size: 13px; color: var(--muted); }

/* records */
.records { display: grid; gap: 14px; }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.rec .fig { font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.rec .who { font-weight: 600; }
.rec .ctx { font-size: 13px; color: var(--muted); }
.rec .actions { margin-top: 6px; }

/* explorer */
.explorer { display: grid; gap: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
.search { position: relative; flex: 1 1 240px; max-width: 340px; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 7px 12px; font-size: 13.5px; font-weight: 500; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); }
.chips button:hover { border-color: var(--ink-2); }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.sel-ctl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.sel-ctl select { padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--ink); }
.near-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.near-ctl button[aria-pressed="true"] { background: var(--spot); border-color: var(--spot); color: #fff; }

.explorer-body { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 940px) { .explorer-body { grid-template-columns: minmax(0, 1fr); } }
.map-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; scroll-margin-top: 12px; }
@media (min-width: 941px) and (min-height: 840px) { .map-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
@media (max-width: 560px) { .map-panel { padding: 10px; } }
.map-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.s1 { background: var(--q1); } .s2 { background: var(--q2); } .s3 { background: var(--q3); } .s4 { background: var(--q4); } .s5 { background: var(--q5); }
.s0 { background: var(--nonhome); box-shadow: inset 0 0 0 1px var(--line-2); }

.map-wrap { position: relative; overflow: hidden; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); aspect-ratio: 1 / 1; max-height: 72vh; touch-action: none; user-select: none; -webkit-user-select: none; }
.map-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map { cursor: grab; }
#map.dragging { cursor: grabbing; }
.map-wrap.picking #map { cursor: crosshair; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.pin { position: absolute; width: 22px; height: 22px; margin: 0; padding: 0; border-radius: 50%; border: 2px solid var(--surface); background: var(--pin); color: var(--pin-ink); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))); pointer-events: auto; }
.pin.p1 { width: 28px; height: 28px; font-size: 13px; line-height: 24px; }
.pin:hover { background: var(--accent); color: var(--accent-ink); }
.ring { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--ink); box-shadow: 0 0 0 2px var(--surface), inset 0 0 0 2px var(--surface); transform: translate(-50%, -50%); }
.spot { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; }
.spot i { width: 14px; height: 14px; border-radius: 50%; background: var(--spot); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--spot); }
.spot b { position: absolute; top: 14px; font-size: 11px; font-weight: 700; color: var(--spot); background: var(--surface); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
.tlabel { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0 3px var(--surface), 0 0 6px var(--surface), 0 0 9px var(--surface); white-space: nowrap; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.35; white-space: nowrap; box-shadow: var(--shadow); }
.tip strong { display: block; font-size: 15px; }
.tip span { display: block; }
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; z-index: 4; }
.zoom[hidden] { display: none; }
.zoom button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-size: 18px; font-weight: 600; line-height: 1; display: grid; place-items: center; box-shadow: var(--shadow); }
.map-hint { position: absolute; left: 10px; bottom: 10px; z-index: 4; font-size: 12.5px; font-weight: 600; background: var(--ink); color: var(--surface); padding: 6px 10px; border-radius: 8px; }
.lod-note { position: absolute; left: 10px; top: 10px; z-index: 3; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 4px 8px; border-radius: 8px; pointer-events: none; max-width: calc(100% - 20px); }
.lod-note[hidden] { display: none; }
@media (max-width: 560px) { .lod-long { display: none; } }
#sky3d { position: absolute; inset: 0; z-index: 3; background: var(--surface-2); }
.deck-note { position: absolute; left: 10px; bottom: 10px; z-index: 4; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 5px 9px; border-radius: 8px; max-width: calc(100% - 20px); }
.fitres { position: absolute; left: 10px; top: 10px; z-index: 4; }

.selected { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.sel-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
.sel-addr { font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.15; }
.sel-addr small { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.sel-v { font-size: 18px; font-weight: 700; text-align: right; white-space: nowrap; }
.sel-sub { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.sel-detail { font-size: 12.5px; color: var(--ink-2); }

/* list */
.list-panel { display: grid; gap: 10px; }
.list-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; grid-template-areas: "rk addr v"; gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.is-sel { background: var(--accent-soft); }
.row .rk { grid-area: rk; font-size: 14px; }
.row .addr { grid-area: addr; min-width: 0; }
.row .addr .linkish { display: block; overflow-wrap: anywhere; }
.row .v { grid-area: v; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .v small { display: block; margin-left: auto; max-width: 15em; white-space: normal; text-wrap: balance; font-size: 12px; font-weight: 500; color: var(--muted); }
.meta { display: block; font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) {
  .row { grid-template-columns: 54px minmax(0, 1fr) auto; padding: 10px 12px; gap: 4px 10px; }
  .row .rk { font-size: 13px; }
}
.rows .empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.more { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* my home */
.myhome { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 12px; }
.myhome.empty { background: var(--surface-2); }
.mh-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; }
.mh-head h2 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; }
.mh-head h2 small { font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.mh-val { font-size: 24px; font-weight: 700; }
.mh-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 18px; padding-block: 10px; border-block: 1px solid var(--line); }
@media (max-width: 760px) { .mh-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mh-stats div { display: grid; gap: 1px; }
